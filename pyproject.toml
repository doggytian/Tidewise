[project]
name = "tidewise"
version = "0.2.0"
description = "中低频国内期货 CTA 交易系统（日线趋势跟踪，半自动执行）"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = { text = "MIT" }
dependencies = [
    "akshare>=1.14",
    "pandas>=2.2",
    "pyarrow>=16",
    "pydantic>=2.7,<3",
    "pyyaml>=6.0",
    "vnpy>=4.4,<5",
    "vnpy-portfoliostrategy>=1.3,<2",
]

[project.optional-dependencies]
# P2 起启用：数据与研究
research = [
    "pandas>=2.2",
    "numpy>=1.26",
    "pyarrow>=16",
    "akshare>=1.14",
]
# P4 起启用：CTP 联调（仅在 Linux 服务器）
live = [
    "vnpy>=4.0",
    "vnpy_ctp>=6.7",
]

[project.scripts]
tidewise = "tidewise.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tidewise"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
